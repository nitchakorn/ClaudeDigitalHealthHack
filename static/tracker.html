<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referral Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Tokens follow the team's Referral Note Drafter so the two pages read as one product. */
  :root {
    --bg: #eef1f4; --panel: #fbfcfd; --raised: #ffffff; --line: #cdd5dd; --line-soft: #e1e6eb;
    --fg: #17212b; --muted: #55636f; --accent: #0f5e7a; --accent-fg: #ffffff; --sel: #dcebf1;
    --ctl: #7d8a97; --warn: #8a5200; --warn-bg: #fbf1e2; --ok: #1d6b45; --ok-bg: #e3f1e9; --bad: #a3262b;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --r: 6px; --r-sm: 4px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161b; --panel: #182129; --raised: #1e2933; --line: #2e3b46; --line-soft: #26323c;
      --fg: #e3e9ee; --muted: #9aa8b4; --accent: #6cc0dc; --accent-fg: #0b1820; --sel: #213744;
      --ctl: #738290; --warn: #e0a54a; --warn-bg: #2b2215; --ok: #74c79a; --ok-bg: #16281f; --bad: #f08a8d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); min-height: 100dvh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ico.sm { width: 16px; height: 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- top bar ---- */
  .bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--panel) 92%, transparent);
         backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  .brand { display: flex; flex-direction: column; margin-right: auto; }
  .brand b { font-size: 17px; letter-spacing: -0.01em; }
  .brand span { font-size: 12px; color: var(--muted); }
  .personas { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .personas button { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 12px; border: 0; border-radius: 6px;
                     background: none; cursor: pointer; text-align: left; color: var(--muted); }
  .personas button span { display: flex; flex-direction: column; line-height: 1.25; }
  .personas button small { font-size: 11px; }
  .personas button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
  .personas button[aria-pressed="true"] .ico { color: var(--accent); }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: var(--panel);
           font: 600 11px/18px var(--mono); text-align: center; }
  .clock { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .clock time { font: 500 13px var(--mono); color: var(--fg); }
  .demo { border-top: 1px dashed var(--ctl); background: var(--bg); }
  .demo-in { max-width: 1320px; margin: 0 auto; padding: 6px 20px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); }
  .demo-in b { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg); }
  .demo-in .btn { min-height: 44px; padding: 4px 12px; font-size: 13px; }
  .demo-in select { width: auto; font-size: 13px; }
  .demo-in time { font: 500 13px var(--mono); color: var(--fg); }
  .quote { border-left: 3px solid var(--ctl); padding: 6px 10px; font-size: 13px; background: var(--raised); margin: 0; white-space: pre-wrap; }
  .why { font-size: 13px; color: var(--warn); margin: 0; }
  h1[tabindex] { outline-offset: 4px; }

  main { max-width: 1320px; margin: 0 auto; padding: 18px 20px 48px; }

  /* ---- shared pieces ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px;
         border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
         font-weight: 500; cursor: pointer; transition: filter 150ms ease-out; }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.quiet { background: transparent; border-color: var(--line); color: var(--fg); }
  .btn.warn { background: var(--warn); border-color: var(--warn); color: var(--panel); }
  .btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
  .ph { margin: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line);
        font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .pb { padding: 16px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
  .chip.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
  .chip.accent { color: var(--accent); border-color: var(--accent); }
  .ai { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); font-weight: 500; }

  /* Signature: the rubber stamp from paper referral slips, one per view, marks where the referral stands. */
  .stamp { display: inline-block; font: 600 20px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
           color: var(--accent); border: 2.5px solid currentColor; border-radius: 4px; padding: 8px 12px 7px;
           transform: rotate(-4deg); box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 3.5px currentColor; white-space: nowrap; justify-self: start; align-self: center; }
  .stamp small { display: block; font-size: 11px; letter-spacing: 0.1em; margin-top: 5px; font-weight: 500; }
  .stamp.warn { color: var(--warn); } .stamp.ok { color: var(--ok); }
  @media (prefers-reduced-motion: no-preference) {
    .stamp.fresh { animation: thunk 260ms cubic-bezier(.2,.9,.3,1.3); }
    @keyframes thunk { from { transform: rotate(-4deg) scale(1.35); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
  }

  /* Horizontal stepper */
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); }
  .steps li { position: relative; text-align: center; font-size: 12px; color: var(--muted); padding: 24px 2px 0; line-height: 1.3; }
  .steps li::before { content: ""; position: absolute; top: 6px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
                      border: 2px solid var(--ctl); background: var(--panel); z-index: 1; }
  .steps li::after { content: ""; position: absolute; top: 12px; right: 50%; width: 100%; height: 2px; background: var(--line); }
  .steps li:first-child::after { display: none; }
  .steps li.done::before { background: var(--ok); border-color: var(--ok); }
  .steps li.done::after, .steps li.now::after { background: var(--ok); }
  .steps li.now { color: var(--fg); font-weight: 600; }
  .steps li.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--sel); }
  .steps li.stall::before { background: var(--warn); border-color: var(--warn); box-shadow: 0 0 0 4px var(--warn-bg); }
  .steps li small { display: block; font: 400 11px var(--mono); margin-top: 2px; }

  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .log li { display: grid; grid-template-columns: 64px 104px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
  .log li:first-child { border-top: 0; }
  .log time { font: 12px var(--mono); color: var(--muted); padding-top: 1px; }
  .log b { font-weight: 500; font-size: 12px; color: var(--muted); padding-top: 1px; }
  .log li.agent b { color: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

  textarea, input[type=text], select { width: 100%; background: var(--raised); border: 1px solid var(--ctl); border-radius: var(--r-sm); padding: 8px 10px; min-height: 44px; }
  textarea { font: 13px/1.55 var(--mono); resize: vertical; }
  label.lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .check { display: flex; gap: 10px; align-items: center; min-height: 44px; font-size: 14px; cursor: pointer; }
  .check input { width: 20px; height: 20px; min-height: 0; flex: none; accent-color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 16px; }

  /* ---- PCP office view ---- */
  .pcp { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
  .tabs button { min-height: 44px; border: 0; background: none; padding: 6px 10px 8px; cursor: pointer; color: var(--muted); font-size: 13px; border-bottom: 2px solid transparent; }
  .tabs button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .queue { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .queue button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; text-align: left; padding: 10px 10px;
                  border: 1px solid transparent; border-radius: var(--r-sm); background: none; cursor: pointer; }
  .queue button:hover { background: var(--sel); }
  .queue button[aria-current="true"] { background: var(--sel); border-color: var(--accent); }
  .queue .nm { font-weight: 500; }
  .queue .sub { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .queue .st { font-size: 12px; display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
  .queue .st.need { color: var(--warn); font-weight: 500; }
  .detail-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: center; }
  .detail-head h1 { margin: 0; font-size: 26px; letter-spacing: -0.015em; line-height: 1.15; }
  .detail-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .next { border: 1px solid var(--accent); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; background: var(--raised); }
  .next.warn { border-color: var(--warn); background: var(--warn-bg); }
  .next.calm { border-color: var(--line); }
  .next .what { flex: 1 1 280px; display: flex; gap: 12px; align-items: flex-start; }
  .next .what b { display: block; }
  .next .what span { font-size: 13px; color: var(--muted); }
  .next.warn .ico { color: var(--warn); }
  .next.stack .what { flex: none; }
  .card .chip { white-space: normal; }
  .split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  #packet { min-height: 300px; }

  /* ---- Endo office view ---- */
  .endo { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
  .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-height: 260px; display: flex; flex-direction: column; }
  .col h2 { margin: 0; padding: 10px 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
            display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .col ul { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .card { width: 100%; text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; cursor: pointer;
          display: flex; flex-direction: column; gap: 4px; transition: border-color 150ms ease-out; }
  .card:hover { border-color: var(--accent); }
  .card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--sel); }
  .card b { font-weight: 500; font-size: 14px; }
  .card span { font-size: 12px; color: var(--muted); }
  .packet-view { font: 12.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--raised); border: 1px solid var(--line-soft);
                 border-radius: var(--r-sm); padding: 12px; max-height: 360px; overflow: auto; margin: 0; }
  .radio { display: flex; gap: 6px; flex-wrap: wrap; }
  .radio label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; min-height: 44px; border: 1px solid var(--ctl); border-radius: var(--r-sm); cursor: pointer; font-size: 14px; }
  .radio input { accent-color: var(--accent); width: auto; min-height: 0; }
  .radio label:has(input:checked) { border-color: var(--accent); background: var(--sel); }

  /* ---- Patient view ---- */
  .pt-wrap { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 32px; align-items: start; justify-content: center; }
  .phone { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px 24px; box-shadow: 0 12px 32px rgb(15 30 45 / 0.10); }
  .phone h1 { font-size: 30px; line-height: 1.12; letter-spacing: -0.02em; margin: 14px 0 8px; }
  .phone .lead { font-size: 16px; margin: 0 0 18px; }
  .hello { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
  .tl { list-style: none; margin: 22px 0 0; padding: 0; }
  .tl li { position: relative; padding: 0 0 18px 30px; }
  .tl li::before { content: ""; position: absolute; left: 6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); z-index: 1; }
  .tl li::after { content: ""; position: absolute; left: 12px; top: 16px; bottom: -4px; width: 2px; background: var(--line); }
  .tl li:last-child::after { display: none; }
  .tl li.done::before { background: var(--ok); border-color: var(--ok); }
  .tl li.done::after { background: var(--ok); }
  .tl li.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--sel); }
  .tl b { font-weight: 500; font-size: 15px; }
  .tl li:not(.done):not(.now) b { color: var(--muted); font-weight: 400; }
  .tl .meta { display: block; font: 12px var(--mono); color: var(--muted); }
  .slots { display: flex; flex-direction: column; gap: 8px; margin: 0 0 8px; }
  .slots button { min-height: 48px; justify-content: space-between; }
  .msgs { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .msgs li { font-size: 14px; padding: 8px 12px; border-radius: 12px; max-width: 88%; }
  .msgs li.me { align-self: flex-end; background: var(--sel); }
  .msgs li.them { align-self: flex-start; background: var(--raised); border: 1px solid var(--line); }
  .msgs li small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .side-notes { font-size: 14px; color: var(--muted); max-width: 420px; }
  .side-notes h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg); margin: 6px 0 10px; }
  .side-notes ul { padding-left: 18px; margin: 0 0 16px; }
  .side-notes li { margin-bottom: 6px; }

  @media (max-width: 1100px) {
    .endo { grid-template-columns: minmax(0, 1fr); }
    .board { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  }
  @media (max-width: 960px) {
    .pcp, .split, .pt-wrap { grid-template-columns: minmax(0, 1fr); }
    .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 12px; }
    .steps li::after { display: none; }
  }
  @media (max-width: 640px) {
    .bar { position: static; }
    .bar-in { padding: 8px 12px; } main { padding: 14px 12px 40px; }
    .personas { width: 100%; } .personas button { flex: 1; justify-content: center; } .personas small { display: none; }
    .log li { grid-template-columns: 56px minmax(0, 1fr); } .log b { grid-column: 2; }
    .detail-head { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><b>Referral Tracker</b><span>Type 2 diabetes · primary care to endocrinology</span></div>
    <nav class="personas" aria-label="Whose view">
      <button type="button" data-persona="patient"><svg class="ico" viewBox="0 0 24 24" data-i="user"></svg><span>Patient<small id="ptName">—</small></span></button>
      <button type="button" data-persona="pcp"><svg class="ico" viewBox="0 0 24 24" data-i="stethoscope"></svg><span>PCP office<small>Dana, referral coordinator</small></span><span class="badge" id="pcpBadge" hidden></span></button>
      <button type="button" data-persona="endo"><svg class="ico" viewBox="0 0 24 24" data-i="hospital"></svg><span>Endo office<small>Intake + Dr. Lee</small></span><span class="badge" id="endoBadge" hidden></span></button>
    </nav>
  </div>
  <div class="demo" role="region" aria-label="Demo controls">
    <div class="demo-in">
      <b>Demo controls</b>
      <span>Day <time id="today"></time></span>
      <button class="btn quiet" type="button" id="advance"><svg class="ico sm" viewBox="0 0 24 24" data-i="fast-forward"></svg>Next day</button>
      <button class="btn quiet" type="button" id="resetAll">Reset demo</button>
      <button class="btn ghost" type="button" id="undoReset" hidden>Undo reset</button>
      <label for="ptPick">Patient view shows</label><select id="ptPick"></select>
      <span>Demo: synthetic patients. Office, payer and patient actions are simulated.</span>
      <span id="claudeMode">Checking for Claude…</span>
      <a href="/" style="color:inherit">Open the note drafter</a>
    </div>
  </div>
</header>
<div id="live" class="sr" aria-live="polite"></div>
<main id="main" tabindex="-1"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>.qr{background:#fff;padding:6px;border-radius:6px;flex:none;line-height:0}.qr svg{display:block;width:104px;height:104px}</style>
<script>
/* ---------- icons: Lucide (ISC license), inlined because the page loads no external scripts ---------- */
const ICONS = {
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  stethoscope: '<path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/>',
  hospital: '<path d="M12 7v4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M14 9h-4"/><path d="M18 11h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2"/><path d="M18 21V5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  send: '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',

function blockers(text) {
  const out = [];
  if (/\[suggested\s*-\s*confirm\]/i.test(text)) out.push('confirm or rewrite the clinical question and remove "[suggested - confirm]"');
  const i = text.toUpperCase().indexOf('TO CONFIRM BEFORE SENDING');
  if (i >= 0) {
    const rest = text.slice(i + 25).split('\n').map(x => x.trim()).filter(x => x && !/^[-•\s]*(none|nothing)\b/i.test(x));
    if (rest.length) out.push('resolve, then delete, the items under "TO CONFIRM BEFORE SENDING"');

/* Reads the server's newline-delimited JSON stream for a note draft or revision. */
async function streamNote(body, onText) {
  const res = await fetch('/api/referrals', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
  if (!res.ok) throw new Error('The server could not start the draft.');
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buffer = '', text = '', finished = false;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (!line) continue;
      const ev = JSON.parse(line);
      if (ev.type === 'text') { text += ev.text; onText(text); }
      else if (ev.type === 'error') throw new Error(ev.message);
      else if (ev.type === 'done') finished = true;
    }
  }
  if (!finished) throw new Error('The draft was interrupted.');
  return text;
}

const CLINICAL = /\b(pain|hurt|ache|sick|ill|nause|vomit|dizz|faint|sugar|glucose|a1c|dose|dosage|pill|tablet|medic|meds?|metformin|insulin|side effect|symptom|thirst|blur|vision|numb|tingl|wound|sore|fever|breath|chest|stomach|diarrhea|headache|tired|weak|sweat|shak|swell|bleed|feel|felt|feeling|awful|worse|bad|scared|worried|anxious|emergency|eat|diet|food|weight|stop taking|test result|lab|blood)/i;

async function routeMessage(r, text) {
  const facts = `Referral to ${SPEC}. Current status: ${STEPS[r.step].pt}. ${r.appt ? 'Appointment: ' + fmtLong(r.appt) + '.' : ''} ${r.slots.length && r.step === 5 ? 'Open slots: ' + r.slots.map(fmtLong).join('; ') + '.' : ''}`;

    if (!res.ok) throw new Error('routing failed');

        h('fieldset', { style: 'border:0;margin:0;padding:0' }, h('legend', { class: 'lbl' }, `Triage priority · Dr. Patel sent this as ${r.urgency.toLowerCase()}; Dr. Lee confirms or changes it`),
          h('div', { class: 'radio' }, URG.map(v => h('label', {}, h('input', { type: 'radio', name: 'prio', value: v, checked: v === r.urgency }), v)))),
        h('div', {}, h('button', { class: 'btn', type: 'button', 'data-primary': true, onclick: () => {
          const v = document.querySelector('input[name=prio]:checked').value; r.priority = v; advance(r, 5);
          r.slots = [...new Set(SLOT_GAPS[v].map(g => weekday(S.day + g)))];
          log(r, 'Dr. Lee', v === r.urgency ? `Accepted. Kept the PCP's urgency: ${v.toLowerCase()}.` : `Accepted. Changed triage priority from the PCP's ${r.urgency.toLowerCase()} to ${v.toLowerCase()}.`); log(r, 'Agent', `Offered the patient ${r.slots.length} open slots.`); done(); } }, icon('check', 'sm'), 'Accept referral')),
        declineRow(r),
        infoOpen(r) ? h('p', { class: 'muted', style: 'font-size:13px;margin:0' }, 'Waiting on Dr. Patel’s office to answer your request.')
          : r.info ? null : h('div', { style: 'border-top:1px solid var(--line);padding-top:12px' }, h('label', { class: 'lbl', for: 'infoAsk' }, 'Missing something? Ask the PCP office'), h('div', { class: 'row', style: 'flex-wrap:nowrap' }, ask,
            h('button', { class: 'btn ghost', type: 'button', onclick: () => { const t = ask.value.trim(); if (!t) { ask.focus(); return; } r.info = { ask: t, answer: '' }; log(r, 'Endo office', `Asked the PCP office for more information: ${t}`); done(); } }, 'Request'))));
    }
    else if (r.step === 5) action = h('div', { class: 'stack', style: 'gap:8px' }, h('span', { class: 'muted', style: 'font-size:13px' }, `Offered ${r.slots.map(fmt).join(', ')}. Waiting for the patient to pick.`),
      h('div', {}, h('button', { class: 'btn ghost', type: 'button', 'data-primary': true, onclick: () => { book(r, r.slots[0], 'Endo office'); } }, icon('calendar', 'sm'), `Book ${fmt(r.slots[0])} by phone`)));
    else if (r.step <= 7 && r.missed) action = h('span', { class: 'chip warn' }, icon('alert', 'sm'), 'Patient did not arrive · PCP office alerted');
    else if (r.step <= 7 && !r.checkedIn) action = h('div', { class: 'stack', style: 'gap:8px' },
      h('span', { class: 'muted', style: 'font-size:13px' }, `Visit ${fmt(r.appt)}. At arrival, scan the patient's QR code (${r.code}) to open this record.`),
      h('div', {}, h('button', { class: 'btn', type: 'button', 'data-primary': true, onclick: () => {
        const day = Math.max(r.appt, S.day); if (r.step === 6) advance(r, 7, day); r.checkedIn = day;
        log(r, 'Endo office', `Scanned QR code ${r.code}. Patient checked in.`, day); done(); } }, icon('check', 'sm'), 'Scan QR code + check in')));
    else if (r.step <= 7) action = replyForm(r);
    else action = h('span', { class: 'chip ok' }, icon('done', 'sm'), 'Consult note sent to the PCP');

    side = h('section', { class: 'panel', 'aria-label': 'Referral detail' },
      ph('Referral detail'),
      h('div', { class: 'pb stack' },
        h('div', { class: 'detail-head' }, h('div', {}, h('p', { class: 'eyebrow' }, `From Dr. Patel's office · to ${r.office} · ${r.refNo || 'no HMO ref'}`), h('h1', { style: 'font-size:22px', tabindex: '-1' }, q.name),
          h('p', {}, `${q.age}-year-old ${q.sex} · Urgency from Dr. Patel: `, h('b', {}, r.urgency), r.priority && r.priority !== r.urgency ? ` · Triaged as ${r.priority.toLowerCase()}` : '')), stamp(r, freshKey(r, 'endo'), 'endo')),
        r.step === 3 && r.nudged ? h('div', {}, h('p', { class: 'lbl' }, 'Message from Dr. Patel’s office'), h('blockquote', { class: 'quote' }, r.nudgeText)) : null,
        r.info ? h('div', {}, h('p', { class: 'lbl' }, 'You asked'), h('blockquote', { class: 'quote' }, r.info.ask),
          r.info.answer ? h('div', { style: 'margin-top:8px' }, h('p', { class: 'lbl' }, 'Dr. Patel’s office replied'), h('blockquote', { class: 'quote' }, r.info.answer)) : null) : null,
        action,
        h('div', {}, h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:6px' }, h('span', { class: 'lbl', style: 'margin:0' }, 'Referral packet'),
          r.packetBy === 'claude' ? h('span', { class: 'ai' }, icon('sparkles', 'sm'), 'AI-drafted, approved by PCP office') : h('span', { class: 'chip' }, 'Approved by PCP office')),
          h('pre', { class: 'packet-view', tabindex: '0', 'aria-label': 'Referral packet text' }, r.packet || '(no packet)'))));
  }
  m.append(h('div', { class: 'endo' }, board, side));
}

function book(r, day, who) {
  r.appt = day; r.noBook = false; advance(r, 6); log(r, who, `Booked ${fmtLong(day)}.`); done();
}

function renderPatient(m) {
  const r = S.refs[S.ptSel], p = PTS[r.pid];
  const finished = r.step === 8;
  const tl = h('ol', { class: 'tl', 'aria-label': 'Your referral steps' }, STEPS.map((s, i) => {
    const cls = i < r.step || finished ? 'done' : i === r.step ? 'now' : '';
    return h('li', { class: cls, 'aria-current': i === r.step ? 'step' : null }, h('b', {}, s.tl || s.pt),
      h('span', { class: 'meta' }, r.at[i] != null ? fmt(r.at[i]) : ''));
  }));
  let act = null;
  if (r.step === 5) act = h('div', {}, h('p', { class: 'eyebrow' }, 'Open times'),
    h('div', { class: 'slots' }, r.slots.map((d, i) => h('button', { class: 'btn quiet', type: 'button', 'data-primary': i === 0, onclick: () => book(r, d, 'Patient') }, h('span', {}, fmtLong(d)), icon('calendar', 'sm')))));
  if (r.step >= 6 && r.step < 8) act = h('div', { class: 'stack', style: 'gap:10px;align-items:flex-start' },
    h('p', { class: 'chip accent', style: 'font-size:14px;padding:6px 12px;margin:0' }, icon('calendar', 'sm'), `${fmtLong(r.appt)} · ${r.office}`),
    !r.checkedIn && !r.missed ? h('button', { class: 'btn quiet', type: 'button', id: 'otherTime', onclick: () => { log(r, 'Patient', `Asked for a different time than ${fmt(r.appt)}.`); reoffer(r, 'Patient asked for another time.'); } }, 'Ask for another time') : null);
  const told = patientStatus(r);

  const who = x => x.me ? 'You' : x.route === 'staff' ? 'Dana · Dr. Patel’s office' : x.route === 'nurse' ? 'Care team · sent to a nurse' : x.ai ? 'Automatic answer (AI) · based on your referral status' : 'Automatic answer · based on your referral status';
  const msgList = h('ul', { class: 'msgs' }, r.msgs.map(x => h('li', { class: x.me ? 'me' : 'them' }, x.text, h('small', {}, who(x)))));
  const input = h('input', { type: 'text', id: 'ask', placeholder: 'e.g. Did the office get my referral?' });
  const send = h('button', { class: 'btn', type: 'button', onclick: async () => {
    const t = input.value.trim(); if (!t) { input.focus(); return; }
    r.msgs.push({ me: true, text: t }); save(); render(); $('ask').disabled = true;
    const out = await routeMessage(r, t); r.msgs.push({ me: false, text: out.reply, route: out.route, ai: out.ai });
    pendingSay = 'Reply: ' + out.reply; save(); render(); $('ask')?.focus({ preventScroll: true });
  } }, 'Send');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send.click(); });

  const phone = h('section', { class: 'phone', 'aria-label': 'Patient view' },
    h('div', { class: 'hello' }, h('span', {}, `Hi ${first(p.name)}`)),
    h('div', { style: 'margin-top:18px' }, stamp(r, freshKey(r, 'patient'), 'patient')),
    h('h1', { tabindex: '-1' }, told.pt),
    h('p', { class: 'lead' }, told.ptText),
    act, r.code && r.step < 8 ? qrCard(r) : null, tl,
    h('div', { style: 'border-top:1px solid var(--line);padding-top:16px;margin-top:4px' },
      h('h2', { class: 'eyebrow' }, 'Questions about your referral'), msgList,
      h('label', { class: 'lbl', for: 'ask' }, 'Message your care team'),
      h('div', { class: 'row', style: 'flex-wrap:nowrap' }, input, send),
      h('p', { class: 'muted', style: 'font-size:12px;margin:8px 0 0' }, 'Questions about your referral status get an automatic answer. Everything else goes to a nurse. This tracker never gives medical advice.')));

  m.append(h('div', { class: 'pt-wrap' }, phone,
    h('aside', { class: 'side-notes', 'aria-label': 'Presenter notes' },
      h('p', { class: 'chip' }, 'For presenters · not part of the patient app'),
      h('h2', {}, 'What the patient does not see'),
      h('ul', {},
        h('li', {}, 'Stalls. If the office is slow, the coordinator is alerted, not the patient.'),
        h('li', {}, 'Payer details beyond "insurance approved".'),
        h('li', {}, 'The packet itself. It goes clinician to clinician.')),
      h('h2', {}, 'Where a person decides'),
      h('ul', {},
        h('li', {}, 'Dana reads and sends the packet, the payer request, every nudge and every reminder.'),
        h('li', {}, 'Dr. Lee sets the priority.'),
        h('li', {}, 'The patient picks the time.'),
        h('li', {}, 'A nurse answers every health question, and every message the tracker is not sure about.')))));
}

function render() {
  const m = $('main'), act = document.activeElement, inMain = m.contains(act), fk = act?.dataset?.fk;
  m.textContent = '';
  document.querySelectorAll('.personas button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.persona === S.persona)));
  const dn = Object.values(S.refs).filter(needsDana).length, en = Object.values(S.refs).filter(endoNeeds).length;
  $('pcpBadge').hidden = !dn; $('pcpBadge').textContent = dn; $('pcpBadge').setAttribute('aria-label', `${dn} need attention`);
  $('endoBadge').hidden = !en; $('endoBadge').textContent = en; $('endoBadge').setAttribute('aria-label', `${en} need attention`);
  $('ptName').textContent = PTS[S.ptSel].name;
  $('today').textContent = fmt(S.day);
  $('undoReset').hidden = !UNDO;
  const pick = $('ptPick'); pick.textContent = '';
  for (const x of Object.values(S.refs)) pick.append(h('option', { value: x.pid, selected: x.pid === S.ptSel }, PTS[x.pid].name));
  ({ pcp: renderPCP, endo: renderEndo, patient: renderPatient })[S.persona](m);
  /* Keep keyboard and screen-reader users where they were: same control if it still exists, else the next action, else the heading. */
  if (inMain) (fk && m.querySelector(`[data-fk="${fk}"]`) || m.querySelector('[data-primary]:not(:disabled)') || m.querySelector('h1'))?.focus({ preventScroll: true });
  if (pendingSay) { $('live').textContent = pendingSay; pendingSay = ''; }
}
function showMode() { $('claudeMode').textContent = LIVE ? `Claude: live (${MODEL})` : 'Claude: no API key on the server, template drafts only'; }

function fromHash() { const v = location.hash.slice(1); if (S && VIEWS.includes(v) && v !== S.persona) { S.persona = v; lastStamp = ''; render(); } }
window.addEventListener('hashchange', fromHash);
document.querySelectorAll('.personas button').forEach(b => b.onclick = () => {
  S.persona = b.dataset.persona; lastStamp = ''; history.replaceState(null, '', '#' + S.persona); save(); render();
  $('main').querySelector('h1')?.focus({ preventScroll: true });
});
$('advance').onclick = () => { S.day++; agentTick(); pendingSay = pendingSay || `Demo day is now ${fmt(S.day)}.`; done(); };
$('resetAll').onclick = () => { UNDO = JSON.stringify(S); const persona = S.persona; freshState(); S.persona = persona; pendingSay = 'Demo reset. Undo is available.'; done(); $('undoReset').focus(); };
$('undoReset').onclick = () => { if (!UNDO) return; S = JSON.parse(UNDO); UNDO = null; pendingSay = 'Reset undone.'; done(); $('resetAll').focus(); };
$('ptPick').onchange = e => { S.ptSel = e.target.value; done(); };

fetch('/api/tracker/data').then(r => r.json()).then(d => {
  DATA = d; for (const p of d.condition.patients) PTS[p.id] = p;
  if (!load()) freshState();
  const v = location.hash.slice(1); if (VIEWS.includes(v)) S.persona = v;
  /* A scanned QR code opens the patient status page for that referral. */
  const ref = new URLSearchParams(location.search).get('ref'), hit = ref && Object.values(S.refs).find(x => x.code === ref);
  if (hit) { S.ptSel = hit.pid; S.persona = 'patient'; }
  render();
}).catch(() => { $('main').textContent = 'Could not load the patient data.'; });
fetch('/api/health').then(r => r.json()).then(info => { LIVE = info.mode === 'live'; MODEL = info.model; showMode(); if (DATA) render(); }, () => showMode());
</script>
</body>
</html>
